name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed semantic-version tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish NuGet
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIGURATION: Release
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}/artifacts
      PACKAGE_PROJECT_PATH: src/DotnetAgents.CalDav.Mcp/DotnetAgents.CalDav.Mcp.csproj
      MCP_SERVER_METADATA_PATH: ${{ github.workspace }}/.release-metadata/server.json
      RELEASE_TAG: ${{ inputs.release_tag }}
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Create isolated test artifact directory
        id: test-artifacts
        shell: bash
        run: |
          TEST_ARTIFACTS_DIR=$(mktemp -d "$RUNNER_TEMP/caldav-tests.XXXXXX")
          echo "TEST_ARTIFACTS_DIR=$TEST_ARTIFACTS_DIR" >> "$GITHUB_ENV"
          echo "path=$TEST_ARTIFACTS_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: false

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore

      - name: Determine package version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          VERSION_WITHOUT_BUILD="${PACKAGE_VERSION%%+*}"
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare tag-versioned server metadata
        shell: bash
        run: bash scripts/prepare-release-metadata.sh "$RELEASE_TAG" "$MCP_SERVER_METADATA_PATH"

      - name: Build Release
        run: >
          dotnet build -c Release --no-restore
          /p:McpServerMetadataPath="$MCP_SERVER_METADATA_PATH"

      - name: Run isolated test suite
        run: bash scripts/run-test-suite.sh --artifacts-dir "$TEST_ARTIFACTS_DIR"

      - name: Run Slopwatch
        run: dotnet tool run slopwatch analyze --config .slopwatch/slopwatch.json --fail-on warning

      - name: Upload test evidence
        if: ${{ always() && steps.test-artifacts.outputs.path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-test-evidence-${{ inputs.release_tag }}
          path: ${{ steps.test-artifacts.outputs.path }}
          if-no-files-found: warn
          retention-days: 30

      - name: Clean isolated test artifacts
        if: ${{ always() && steps.test-artifacts.outputs.path != '' }}
        run: bash scripts/cleanup-test-artifacts.sh "$TEST_ARTIFACTS_DIR" "$RUNNER_TEMP"

      - name: Rebuild tag-versioned Release output
        run: >
          dotnet build -c Release --no-restore
          /p:McpServerMetadataPath="$MCP_SERVER_METADATA_PATH"

      - name: Pack
        run: >
          dotnet pack ${{ env.PACKAGE_PROJECT_PATH }}
          -c ${{ env.BUILD_CONFIGURATION }}
          --no-build
          -o ${{ env.PACKAGE_OUTPUT_DIRECTORY }}
          /p:Version=${{ steps.version.outputs.package_version }}
          /p:McpServerMetadataPath="${{ env.MCP_SERVER_METADATA_PATH }}"

      - name: Verify final release packages
        shell: bash
        run: >
          bash scripts/verify-release-package.sh
          "${{ steps.version.outputs.package_version }}"
          "${{ env.PACKAGE_OUTPUT_DIRECTORY }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package-${{ steps.version.outputs.package_version }}
          path: |
            ${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.snupkg
          if-no-files-found: error
          retention-days: 30

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          files: |
            ${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.snupkg
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
