name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed semantic-version tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish NuGet
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIGURATION: Release
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}/artifacts
      PACKAGE_PROJECT_PATH: src/DotnetAgents.CalDav.Mcp/DotnetAgents.CalDav.Mcp.csproj
      MCP_SERVER_METADATA_PATH: ${{ github.workspace }}/.release-metadata/server.json
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: false

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore

      - name: Determine package version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          VERSION_WITHOUT_BUILD="${PACKAGE_VERSION%%+*}"
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare tag-versioned server metadata
        shell: bash
        run: bash scripts/prepare-release-metadata.sh "$RELEASE_TAG" "$MCP_SERVER_METADATA_PATH"

      - name: Build Release
        run: >
          dotnet build -c Release --no-restore
          /p:McpServerMetadataPath="$MCP_SERVER_METADATA_PATH"

      - name: Run tests with coverage serially
        run: |
          dotnet test tests/DotnetAgents.CalDav.Core.Tests.Unit/DotnetAgents.CalDav.Core.Tests.Unit.csproj -c Release --no-build --settings coverage.runsettings --collect:"XPlat Code Coverage" --logger "trx;LogFilePrefix=release-core" --results-directory TestResults
          dotnet test tests/DotnetAgents.CalDav.Mcp.Tests.Unit/DotnetAgents.CalDav.Mcp.Tests.Unit.csproj -c Release --no-build --settings coverage.runsettings --collect:"XPlat Code Coverage" --logger "trx;LogFilePrefix=release-mcp" --results-directory TestResults
          dotnet test tests/DotnetAgents.CalDav.IntegrationTests/DotnetAgents.CalDav.IntegrationTests.csproj -c Release --no-build --settings coverage.runsettings --collect:"XPlat Code Coverage" --logger "trx;LogFilePrefix=release-integration" --results-directory TestResults

      - name: Generate coverage report
        run: >
          dotnet reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:"coverage-report"
          -reporttypes:Cobertura
          -assemblyfilters:"+DotnetAgents.CalDav.Core;+DotnetAgents.CalDav.Mcp;-*Tests*;-xunit*;-testhost*"

      - name: Verify coverage thresholds
        run: bash scripts/verify-coverage.sh coverage-report 0.90 0.85

      - name: Run strict-preconditions Radicale conformance variant
        run: >
          RADICALE_CONFORMANCE_VARIANT=strict-preconditions
          dotnet test tests/DotnetAgents.CalDav.IntegrationTests/DotnetAgents.CalDav.IntegrationTests.csproj
          -c Release
          --no-build
          --filter "FullyQualifiedName~RadicaleConformanceHarnessTests"
          --logger "trx;LogFilePrefix=strict-preconditions"
          --results-directory TestResults

      - name: Run alternate-time-zone Radicale conformance variant
        run: >
          RADICALE_CONFORMANCE_VARIANT=alternate-time-zone
          dotnet test tests/DotnetAgents.CalDav.IntegrationTests/DotnetAgents.CalDav.IntegrationTests.csproj
          -c Release
          --no-build
          --filter "FullyQualifiedName~RadicaleConformanceHarnessTests"
          --logger "trx;LogFilePrefix=alternate-time-zone"
          --results-directory TestResults

      - name: Verify complete normative evidence
        run: |
          bash scripts/verify-test-results.sh TestResults
          bash scripts/verify-release-evidence.sh contracts/0.2.0/requirement-evidence-catalog.md contracts/0.2.0/release-evidence-map.json TestResults

      - name: Run Slopwatch
        run: dotnet tool run slopwatch analyze --config .slopwatch/slopwatch.json --fail-on warning

      - name: Rebuild tag-versioned Release output
        run: >
          dotnet build -c Release --no-restore
          /p:McpServerMetadataPath="$MCP_SERVER_METADATA_PATH"

      - name: Pack
        run: >
          dotnet pack ${{ env.PACKAGE_PROJECT_PATH }}
          -c ${{ env.BUILD_CONFIGURATION }}
          --no-build
          -o ${{ env.PACKAGE_OUTPUT_DIRECTORY }}
          /p:Version=${{ steps.version.outputs.package_version }}
          /p:McpServerMetadataPath="${{ env.MCP_SERVER_METADATA_PATH }}"

      - name: Verify final release packages
        shell: bash
        run: >
          bash scripts/verify-release-package.sh
          "${{ steps.version.outputs.package_version }}"
          "${{ env.PACKAGE_OUTPUT_DIRECTORY }}"
          "${{ env.MCP_SERVER_METADATA_PATH }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package-${{ steps.version.outputs.package_version }}
          path: |
            ${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.snupkg
          if-no-files-found: error
          retention-days: 30

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          files: |
            ${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.snupkg
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
