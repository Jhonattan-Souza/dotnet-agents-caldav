name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: false

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Run tests with coverage serially
        run: |
          dotnet test tests/DotnetAgents.CalDav.Core.Tests.Unit/DotnetAgents.CalDav.Core.Tests.Unit.csproj -c Release --no-build --settings coverage.runsettings --collect:"XPlat Code Coverage" --logger "trx;LogFilePrefix=pr-core" --results-directory TestResults
          dotnet test tests/DotnetAgents.CalDav.Mcp.Tests.Unit/DotnetAgents.CalDav.Mcp.Tests.Unit.csproj -c Release --no-build --settings coverage.runsettings --collect:"XPlat Code Coverage" --logger "trx;LogFilePrefix=pr-mcp" --results-directory TestResults
          dotnet test tests/DotnetAgents.CalDav.IntegrationTests/DotnetAgents.CalDav.IntegrationTests.csproj -c Release --no-build --settings coverage.runsettings --collect:"XPlat Code Coverage" --logger "trx;LogFilePrefix=pr-integration" --results-directory TestResults -m:1 /nodeReuse:false

      - name: Generate coverage report
        run: dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:Cobertura -assemblyfilters:"+DotnetAgents.CalDav.Core;+DotnetAgents.CalDav.Mcp;-*Tests*;-xunit*;-testhost*"

      - name: Verify coverage gate
        run: bash scripts/verify-coverage.sh coverage-report 0.90 0.85

      - name: Run strict-preconditions Radicale conformance variant
        run: >
          RADICALE_CONFORMANCE_VARIANT=strict-preconditions
          dotnet test tests/DotnetAgents.CalDav.IntegrationTests/DotnetAgents.CalDav.IntegrationTests.csproj
          -c Release
          --no-build
          --filter "FullyQualifiedName~RadicaleConformanceHarnessTests"
          --logger "trx;LogFilePrefix=strict-preconditions"
          --results-directory TestResults

      - name: Run alternate-time-zone Radicale conformance variant
        run: >
          RADICALE_CONFORMANCE_VARIANT=alternate-time-zone
          dotnet test tests/DotnetAgents.CalDav.IntegrationTests/DotnetAgents.CalDav.IntegrationTests.csproj
          -c Release
          --no-build
          --filter "FullyQualifiedName~RadicaleConformanceHarnessTests"
          --logger "trx;LogFilePrefix=alternate-time-zone"
          --results-directory TestResults

      - name: Verify complete normative evidence
        run: |
          bash scripts/verify-test-results.sh TestResults
          bash scripts/verify-release-evidence.sh contracts/0.2.0/requirement-evidence-catalog.md contracts/0.2.0/release-evidence-map.json TestResults
          bash scripts/verify-release-evidence.sh contracts/0.2.1/requirement-evidence-catalog.md contracts/0.2.1/release-evidence-map.json TestResults
          bash scripts/verify-release-evidence.sh contracts/0.2.2/requirement-evidence-catalog.md contracts/0.2.2/release-evidence-map.json TestResults

      - name: Run Slopwatch
        run: dotnet tool run slopwatch analyze --config .slopwatch/slopwatch.json --fail-on warning

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30

      - name: Post coverage summary
        run: |
          LINE_RATE=$(grep -oP 'line-rate="[^"]*"' coverage-report/Cobertura.xml | head -1 | grep -oP '[\d.]+')
          BRANCH_RATE=$(grep -oP 'branch-rate="[^"]*"' coverage-report/Cobertura.xml | head -1 | grep -oP '[\d.]+')
          LINE_PCT=$(echo "$LINE_RATE * 100" | bc)
          BRANCH_PCT=$(echo "$BRANCH_RATE * 100" | bc | xargs printf "%.1f")
          LINE_PCT_FMT=$(echo "$LINE_RATE * 100" | bc | xargs printf "%.1f")
          echo "## Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lines  | ${LINE_PCT_FMT}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Branches | ${BRANCH_PCT}% |" >> $GITHUB_STEP_SUMMARY
