name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create isolated test artifact directory
        id: test-artifacts
        shell: bash
        run: |
          TEST_ARTIFACTS_DIR=$(mktemp -d "$RUNNER_TEMP/caldav-tests.XXXXXX")
          echo "TEST_ARTIFACTS_DIR=$TEST_ARTIFACTS_DIR" >> "$GITHUB_ENV"
          echo "path=$TEST_ARTIFACTS_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/toolResolverCache
          key: ${{ runner.os }}-dotnet-${{ hashFiles('global.json', 'Directory.Packages.props', '.config/dotnet-tools.json', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-

      - name: Record dependency cache status
        shell: bash
        run: |
          if [[ "${{ steps.dependency-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "DEPENDENCY_CACHE_STATUS=hit" >> "$GITHUB_ENV"
          else
            echo "DEPENDENCY_CACHE_STATUS=miss" >> "$GITHUB_ENV"
          fi

      - name: Restore local tools
        run: bash scripts/record-phase-timing.sh "$TEST_ARTIFACTS_DIR/phase-timings.tsv" restore-local-tools dotnet tool restore

      - name: Restore packages
        run: bash scripts/record-phase-timing.sh "$TEST_ARTIFACTS_DIR/phase-timings.tsv" restore-nuget-packages dotnet restore --locked-mode

      - name: Build Release
        run: bash scripts/record-phase-timing.sh "$TEST_ARTIFACTS_DIR/phase-timings.tsv" release-build dotnet build -c Release --no-restore

      - name: Run isolated test suite
        run: bash scripts/run-test-suite.sh --artifacts-dir "$TEST_ARTIFACTS_DIR"

      - name: Run Slopwatch
        run: bash scripts/record-phase-timing.sh "$TEST_ARTIFACTS_DIR/phase-timings.tsv" slopwatch dotnet tool run slopwatch analyze --config .slopwatch/slopwatch.json --fail-on warning

      - name: Post timing summary
        if: ${{ always() && steps.test-artifacts.outputs.path != '' }}
        shell: bash
        run: |
          if compgen -G "$TEST_ARTIFACTS_DIR/*.trx" > /dev/null; then
            python3 scripts/trx-timing-summary.py \
              --artifacts-dir "$TEST_ARTIFACTS_DIR" \
              --phase-timings "$TEST_ARTIFACTS_DIR/phase-timings.tsv" \
              --cache-status "${DEPENDENCY_CACHE_STATUS:-not-reported}" \
              --baseline-isolated-suite-seconds 426 \
              --baseline-integration-seconds 322.2 > "$TEST_ARTIFACTS_DIR/timing-summary.md"
            cat "$TEST_ARTIFACTS_DIR/timing-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test evidence
        if: ${{ always() && steps.test-artifacts.outputs.path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: ${{ steps.test-artifacts.outputs.path }}
          if-no-files-found: warn
          retention-days: 30

      - name: Post coverage summary
        if: ${{ success() }}
        run: |
          LINE_RATE=$(grep -m1 -oP 'line-rate="[^"]*"' "$TEST_ARTIFACTS_DIR/coverage-report/Cobertura.xml" | grep -oP '[\d.]+')
          BRANCH_RATE=$(grep -m1 -oP 'branch-rate="[^"]*"' "$TEST_ARTIFACTS_DIR/coverage-report/Cobertura.xml" | grep -oP '[\d.]+')
          BRANCH_PCT=$(echo "$BRANCH_RATE * 100" | bc | xargs printf "%.1f")
          LINE_PCT_FMT=$(echo "$LINE_RATE * 100" | bc | xargs printf "%.1f")
          echo "## Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lines  | ${LINE_PCT_FMT}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Branches | ${BRANCH_PCT}% |" >> $GITHUB_STEP_SUMMARY

      - name: Clean isolated test artifacts
        if: ${{ always() && steps.test-artifacts.outputs.path != '' }}
        run: bash scripts/cleanup-test-artifacts.sh "$TEST_ARTIFACTS_DIR" "$RUNNER_TEMP"
